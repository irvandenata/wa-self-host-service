root = "."
tmp_dir = ".tmp"

[build]
  cmd = "go build -o ./.tmp/wa-service ./cmd/server"
  entrypoint = ["./.tmp/wa-service"]
  delay = 500
  exclude_dir = [".git", ".tmp", "data", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "5s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
